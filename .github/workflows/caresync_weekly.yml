name: CareSync Weekly Pipeline (Phase 1)

on:
  schedule:
    - cron: "0 7 * * 1"   # 07:00 UTC Monday
  workflow_dispatch:       # lets you trigger manually from the Actions tab

jobs:
  caresync-pipeline:
    runs-on: ubuntu-latest
    env:
      RUN_ID: ci-${{ github.run_number }}
      SNOWFLAKE_ROLE: NEXORA_LOADER
      SNOWFLAKE_WAREHOUSE: NEXORA_WH
      SNOWFLAKE_DATABASE_RAW: NEXORA_RAW_WH
      SNOWFLAKE_DATABASE_STAGING: NEXORA_STAGING_WH
      SNOWFLAKE_DATABASE_PROD: NEXORA_PROD_WH
      SNOWFLAKE_AUTH_METHOD: keypair
      SNOWFLAKE_PRIVATE_KEY_PATH: ./config/snowflake_rsa_key.p8
      GDRIVE_FORCE_LOCAL: "true"
      EMAIL_PROVIDER: resend
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Reconstruct Snowflake private key from secret
        run: |
          mkdir -p config

          RAW_LEN=$(echo -n "${{ secrets.SNOWFLAKE_PRIVATE_KEY_B64 }}" | wc -c)
          echo "Secret length as received by Actions: $RAW_LEN characters"

          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY_B64 }}" | tr -d '[:space:]' > /tmp/key_clean_b64.txt
          CLEAN_LEN=$(wc -c < /tmp/key_clean_b64.txt)
          echo "Length after stripping whitespace: $CLEAN_LEN characters"

          # Report any character outside the standard base64 alphabet
          # without ever printing the secret itself, safe to log.
          INVALID_CHARS=$(tr -d 'A-Za-z0-9+/=' < /tmp/key_clean_b64.txt | fold -w1 | sort -u | tr -d '\n')
          if [ -n "$INVALID_CHARS" ]; then
            echo "Found non-base64 character(s) in the secret (shown individually, not in context): '$INVALID_CHARS'"
            exit 1
          fi

          base64 -d /tmp/key_clean_b64.txt > config/snowflake_rsa_key.p8
          chmod 600 config/snowflake_rsa_key.p8
          grep -q "BEGIN PRIVATE KEY" config/snowflake_rsa_key.p8 && echo "PEM header check: OK"

      - name: Set up dbt profile
        run: |
          mkdir -p ~/.dbt
          cp dbt_caresync/profiles_example.yml ~/.dbt/profiles.yml

      - name: Generate this run's weekly batch
        run: python -m scripts.simulate_weekly_drop --run-id "$RUN_ID" --patients 50

      - name: Run the full pipeline
        run: ./scripts/run_local_pipeline.sh "$RUN_ID"
