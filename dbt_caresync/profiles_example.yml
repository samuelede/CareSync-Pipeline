# Copy relevant content into ~/.dbt/profiles.yml (not committed, contains
# credentials). Values pulled from the same .env used by the rest of the
# pipeline so there is one source of truth for Snowflake connection info.
#
# Three databases (NEXORA_RAW_WH / NEXORA_STAGING_WH / NEXORA_PROD_WH), one per
# pipeline layer. The connection's default `database` here is
# NEXORA_STAGING_WH since that's where staging models materialize by
# default; dbt_project.yml overrides +database per model group (RAW
# sources point at NEXORA_RAW_WH, marts materialize into NEXORA_PROD_WH), so
# this default is mostly a fallback, not load-bearing.
#
# Two auth targets below. Use "dev" for password login (default), or
# "dev_keypair" if your account's MFA setup blocks password/CLI login (see
# docs/snowflake_setup.md), key-pair auth is also the standard choice for
# a CI/scheduled dbt run since it needs no browser or MFA prompt at all.
# Switch which one is active with `dbt run --target dev_keypair`, or by
# changing the top-level `target:` value.
caresync:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE_STAGING', 'NEXORA_STAGING_WH') }}"
      schema: STAGING
      threads: 4
    dev_keypair:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      private_key_passphrase: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PASSPHRASE', '') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE_STAGING', 'NEXORA_STAGING_WH') }}"
      schema: STAGING
      threads: 4
