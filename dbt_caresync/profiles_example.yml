# Copy relevant content into ~/.dbt/profiles.yml (not committed, contains
# credentials). Values pulled from the same .env used by the rest of the
# pipeline so there is one source of truth for Snowflake connection info.
#
# One database (CARESYNC_WH), one schema per layer. dbt_project.yml sets the
# per-model schema (staging -> STAGING, marts -> PROD) via config blocks,
# so this profile only needs a single default database and schema.
caresync:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
      schema: STAGING
      threads: 4

