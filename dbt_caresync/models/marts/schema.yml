version: 2

models:
  - name: fct_appointments
    description: "One row per patient encounter (treated as an appointment)."
    columns:
      - name: encounter_id
        tests: [unique, not_null]
      - name: patient_key
        tests:
          - not_null
          - relationships: {to: ref('dim_patients'), field: patient_key}
      - name: provider_key
        tests:
          - relationships: {to: ref('dim_providers'), field: provider_key}
      - name: clinic_key
        tests:
          - relationships: {to: ref('dim_clinics'), field: clinic_key}
      - name: payer_key
        tests:
          - relationships: {to: ref('dim_payers'), field: payer_key}

  - name: dim_patients
    columns:
      - name: patient_key
        tests: [unique, not_null]

  - name: dim_providers
    columns:
      - name: provider_key
        tests: [unique, not_null]

  - name: dim_clinics
    columns:
      - name: clinic_key
        tests: [unique, not_null]

  - name: dim_payers
    columns:
      - name: payer_key
        tests: [unique, not_null]

  - name: conditions_detail
    columns:
      - name: encounter_id
        tests:
          - not_null
          - relationships: {to: ref('fct_appointments'), field: encounter_id}
      - name: patient_key
        tests: [not_null]
