version: 2

# Cross-database source: RAW lives in its own NEXORA_RAW_WH database,
# separate from this project's target database (NEXORA_STAGING_WH). The role
# used to run dbt needs USAGE on NEXORA_RAW_WH granted (see
# docs/snowflake_setup.md, step 6).
sources:
  - name: raw
    database: "{{ env_var('SNOWFLAKE_DATABASE_RAW', 'NEXORA_RAW_WH') }}"
    schema: RAW
    tables:
      - name: organizations
      - name: providers
      - name: payers
      - name: patients
      - name: encounters
      - name: conditions
